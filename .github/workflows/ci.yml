name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    strategy:
      matrix:
        node-version: [18, 20]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax-check .mjs entrypoints
        run: |
          node --check bin/create-wren.mjs
          node --check scripts/research_memory/audit.mjs
          node --check scripts/research_memory/bootstrap.mjs
          node --check scripts/research_memory/config.mjs

      - name: Byte-compile the scripts/ tree (Python)
        run: python3 -m py_compile $(find scripts -name '*.py')

      - name: Install PyYAML (renderer dependency)
        run: python3 -m pip install --quiet pyyaml

      # ---------------------------------------------------------------
      # KEY TEST — regression guard for the v0.1.0/v0.2.0 scaffold-install
      # bug class (paths with spaces breaking the install).
      #
      # Scaffolds non-interactively into a directory whose path CONTAINS A
      # SPACE, then asserts the project verifies clean and was git-initialised.
      # Non-interactive mechanism: bin/create-wren.mjs accepts
      # `--yes` (also auto-detects a non-TTY stdin, which a CI runner always
      # is) to fall through every prompt to its documented default instead of
      # waiting on input — see NONINTERACTIVE in the bin. That's the real,
      # existing flag; nothing here is invented for CI.
      # ---------------------------------------------------------------
      - name: KEY TEST — scaffold into a path with a space (non-interactive)
        run: |
          set -euo pipefail
          TARGET="${{ runner.temp }}/ci scratch/my project"
          mkdir -p "${{ runner.temp }}/ci scratch"
          node bin/create-wren.mjs --yes "$TARGET"

          echo "→ Asserting git repo was initialised…"
          test -d "$TARGET/.git"

          echo "→ Asserting setup:verify exits 0 inside the scaffolded project…"
          cd "$TARGET"
          npm run setup:verify

      - name: Clean up cross-session memory dir seeded by the smoke test
        if: always()
        run: |
          # The scaffolder seeds a per-project memory dir under
          # ~/.claude/projects/<slug>/ keyed off the scaffolded (temp) path.
          # It's a runner-local artifact, not repo state — remove it so the
          # job leaves no residue.
          rm -rf "$HOME/.claude/projects/"*"-ci-scratch-my-project" || true
