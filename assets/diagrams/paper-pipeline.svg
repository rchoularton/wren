<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img">
<title>Wren 14-phase paper pipeline</title>
<desc>A 14-phase pipeline. Analysis: 1 Scope, 2 Data, 3 Explore, 4 Methods, 5 Build, 6 QC (/qc-team). Phase 7 Freeze (/gold-standard) is a gate: no writing until the analysis is frozen. Writing: 8 Draft (/draft), 9 Figures (/figure), 10 Review, 11 QC draft, 12 Submit (/cover-letter), 13 Revise (/revision-response), 14 Publish.</desc>
